services:
  db:
    image: pgvector/pgvector:pg17
    container_name: apsearch-db
    environment:
      POSTGRES_USER: apsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apsearch}
      POSTGRES_DB: apsearch
      # Greek legal text is large; give the planner room.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_workers_per_gather=2
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsearch -d apsearch"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
