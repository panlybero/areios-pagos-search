name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: AreiosPagos-windows-x64.zip
            executable: dist/AreiosPagos/AreiosPagos.exe
          - os: macos-latest
            artifact_name: AreiosPagos-macos-arm64.zip
            executable: dist/AreiosPagos/AreiosPagos
          - os: macos-13
            artifact_name: AreiosPagos-macos-x64.zip
            executable: dist/AreiosPagos/AreiosPagos
          - os: ubuntu-latest
            artifact_name: AreiosPagos-linux-x64.tar.gz
            executable: dist/AreiosPagos/AreiosPagos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[api,mcp] pyinstaller sqlite-vec

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          sep=":"
          if [ "$RUNNER_OS" = "Windows" ]; then
            sep=";"
          fi
          pyinstaller --name AreiosPagos --onedir --noconfirm \
            --add-data "src/apsearch/api/templates/index.html${sep}apsearch/api/templates" \
            --add-data "src/apsearch/db/schema.sql${sep}apsearch/db" \
            --collect-all sqlite_vec \
            --collect-all uvicorn \
            src/apsearch/main_entry.py

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist/AreiosPagos/data
          if [ -f data/areios_pagos_seed.db.gz ]; then
            cp data/areios_pagos_seed.db.gz dist/AreiosPagos/data/
          fi
          cp README.md dist/AreiosPagos/ || true

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp launch.bat dist/AreiosPagos/ || true
            cd dist && powershell Compress-Archive -Path AreiosPagos -DestinationPath ${{ matrix.artifact_name }}
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cp launch.sh dist/AreiosPagos/ || true
            cd dist && tar -czf ${{ matrix.artifact_name }} AreiosPagos
          else
            cp launch.sh dist/AreiosPagos/ || true
            cd dist && zip -r ${{ matrix.artifact_name }} AreiosPagos
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare assets for release
        run: |
          mkdir -p upload
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          # Also package universal source launcher bundles
          zip -j upload/AreiosPagos-Universal-Source.zip launch.sh launch.bat pyproject.toml README.md
          if [ -f data/areios_pagos_seed.db.gz ]; then
            cp data/areios_pagos_seed.db.gz upload/
          fi
          ls -lh upload/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          gh release create "$TAG" upload/* \
            --title "Areios Pagos Search $TAG" \
            --notes "### Άρειος Πάγος — Standalone Case Law Search & MCP Server

          #### Available Packages:
          * **Windows**: Download \`AreiosPagos-windows-x64.zip\`, extract and double-click \`AreiosPagos.exe\` (or run \`launch.bat\`).
          * **macOS (Apple Silicon M1/M2/M3/M4)**: Download \`AreiosPagos-macos-arm64.zip\`, extract and run \`AreiosPagos\`.
          * **macOS (Intel)**: Download \`AreiosPagos-macos-x64.zip\`, extract and run \`AreiosPagos\`.
          * **Universal Source Bundle**: Download \`AreiosPagos-Universal-Source.zip\` and double-click \`launch.sh\` (Mac/Linux) or \`launch.bat\` (Windows).

          #### Features:
          * Pre-seeded with modern case law.
          * Self-hosted single-file SQLite database with \`sqlite-vec\` vector embeddings and Greek FTS5 search.
          * Local Web UI automatically opens in your browser at http://localhost:8765.
          * Prompts for Gemini API key on first launch (saved locally).
          * Connects directly to OpenWork, Claude Desktop, and Cursor via MCP at \`http://localhost:8766/mcp\`.
          * Built-in cost calculator for historical backfills." || \
          gh release upload "$TAG" upload/* --clobber
