name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[api,mcp] pyinstaller sqlite-vec pgvector

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --name AreiosPagos --onefile --noconfirm \
            --add-data "src/apsearch/api/templates/index.html:apsearch/api/templates" \
            --collect-all sqlite_vec \
            --collect-all uvicorn \
            src/apsearch/main_entry.py

      - name: Package single-executable release artifact
        run: |
          mkdir -p package
          cp dist/AreiosPagos package/
          chmod +x package/AreiosPagos
          cp launch.command package/
          cd package && zip -r ../AreiosPagos-macos-arm64.zip .

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG" AreiosPagos-macos-arm64.zip --clobber
